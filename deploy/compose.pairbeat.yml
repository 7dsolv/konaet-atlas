services:
  pairbeat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.pairbeat
    env_file: .env.pairbeat
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
